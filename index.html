<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Albaranes de rampa · CN Águilas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b4f8a">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Albaranes">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6fa;--card:#fff;--tx:#14233a;--mut:#5d6b80;--bd:#d5dde8;--pri:#0b4f8a;--pri-tx:#fff;--ok:#1a7f4b;--wa:#1f9d55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--card:#16212f;--tx:#e8eef6;--mut:#93a3b8;--bd:#2a3a50;--pri:#4d9be0;--pri-tx:#06121f;--ok:#4cc38a;--wa:#2fb868}}
:root[data-theme="dark"]{--bg:#0e1621;--card:#16212f;--tx:#e8eef6;--mut:#93a3b8;--bd:#2a3a50;--pri:#4d9be0;--pri-tx:#06121f;--ok:#4cc38a;--wa:#2fb868}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
header .logo{font-size:30px}
h1{font-size:19px;margin:0}header small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px;color:var(--pri)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:11px}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.svc label{margin:0;color:var(--tx);font-size:15px;display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:10px;padding:12px;background:var(--bg)}
.svc input{width:auto;margin:0;accent-color:var(--pri)}
.svc label:has(input:checked){border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,var(--bg))}
button{font:inherit;font-weight:600;border:0;border-radius:11px;padding:13px 14px;cursor:pointer;background:var(--pri);color:var(--pri-tx)}
button.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.wa{background:var(--wa);color:#fff}
button.sm{padding:9px 10px;font-size:14px}
.full{width:100%}
.club{background:linear-gradient(135deg,#0a3560,#0b4f8a);color:#fff;border-radius:16px;padding:16px;margin:4px 0 14px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.club-top{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.25)}
.club-logo{font-size:30px;width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex:none}
.club-name{font-weight:800;font-size:16px;letter-spacing:.3px;line-height:1.2}
.club-app{font-size:13px;opacity:.85;margin-top:2px}
.club-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:12px;font-size:14px;line-height:1.4}
.club-grid span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;opacity:.7;margin-bottom:2px}
.club-grid a{color:#fff;text-decoration:none;font-weight:600;word-break:break-all}
.club-grid div:last-child{grid-column:1/-1}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.item{border-top:1px solid var(--bd);padding:10px 0}
.item:first-child{border-top:0}
.item b{display:block}.item span{color:var(--mut);font-size:14px}
.ok{border-color:var(--ok)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;display:none;z-index:9;font-size:14px}
</style>
</head>
<body>
<main>
<section class="club" aria-label="Datos del club">
<div class="club-top"><div class="club-logo">⚓</div><div><div class="club-name">PUERTO DEPORTIVO C.N. ÁGUILAS</div><div class="club-app">Albaranes de rampa</div></div></div>
<div class="club-grid">
<div><span>Dirección</span>Paseo de Parra, 44<br>30880 Águilas (Murcia)</div>
<div><span>CIF</span>A73846255</div>
<div><span>Teléfonos</span><a href="tel:+34655441929">655 441 929</a><br><a href="tel:+34670445725">670 445 725</a></div>
<div><span>Email</span><a href="mailto:administracion@cnaguilas.com">administracion@cnaguilas.com</a></div>
</div>
</section>
<button class="full" id="inst" hidden style="margin-bottom:12px">📲 Instalar app</button>

<div class="card">
<h2>Nuevo albarán</h2>
<div class="row">
<div><label>Fecha</label><input type="date" id="fecha"></div>
<div><label>Nº albarán</label><input id="num" readonly></div>
</div>

<label>Náutica que hace el servicio *</label>
<input id="naut" list="nl" placeholder="Nombre de la náutica" autocomplete="off">
<datalist id="nl"></datalist>
<div class="row">
<div><label>CIF</label><input id="cif"></div>
<div><label>Teléfono (WhatsApp)</label><input id="tel" type="tel" inputmode="tel"></div>
</div>
<label>Email</label><input id="mail" type="email" inputmode="email">

<label>Embarcación que saca *</label>
<div class="row">
<input id="emb" placeholder="Nombre / modelo">
<input id="mat" placeholder="Matrícula / folio">
</div>

<label>Servicio *</label>
<div class="svc" id="svc"></div>
<div id="finw" style="display:none"><label>Bono válido hasta (se calcula solo, puedes cambiarla)</label><input type="date" id="fin"></div>

<div class="row">
<div><label>Importe € (opcional)</label><input id="imp" type="number" inputmode="decimal" step="0.01"></div>
<div><label>Quién lo atiende</label><input id="resp" placeholder="Marinero"></div>
</div>
<label>Observaciones</label><textarea id="obs"></textarea>

<button class="full" id="save" style="margin-top:14px">Guardar albarán</button>
</div>

<div class="card ok" id="res" style="display:none">
<h2 id="rt">Albarán guardado</h2>
<div id="rd" style="color:var(--mut);font-size:14px"></div>
<div class="acts" id="ra"></div>
</div>

<div class="card">
<h2>Albaranes guardados</h2>
<div id="hist"></div>
</div>
</main>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var SERV=["Botar por rampa","Varar por rampa","Botar y varar","Bono mes rampa"];
var EMP={n:"PUERTO DEPORTIVO C.N. ÁGUILAS",l:["PASEO DE PARRA, 44","30880 ÁGUILAS (MURCIA)","CIF: A73846255","TLF: 655 441 929 / 670 445 725","administracion@cnaguilas.com"]};
var $=function(i){return document.getElementById(i)};
var mem={};
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return mem[k]!==undefined?mem[k]:d}}
function sv(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var albs=ld("alb",[]),nauts=ld("nauts",{});
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},4500)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fdate(iso){var p=iso.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function nextNum(){var y=new Date().getFullYear(),m=0;albs.forEach(function(a){var p=a.num.split("-");if(+p[0]===y)m=Math.max(m,+p[1])});return y+"-"+String(m+1).padStart(3,"0")}

SERV.forEach(function(s,i){var l=document.createElement("label");l.innerHTML='<input type="radio" name="sv" value="'+s+'">'+s;$("svc").appendChild(l)});
function resetForm(){
  var d=new Date();$("fecha").value=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  $("num").value=nextNum();
  ["naut","cif","tel","mail","emb","mat","imp","obs"].forEach(function(i){$(i).value=""});
  document.querySelectorAll('input[name=sv]').forEach(function(r){r.checked=false});$("fin").value="";$("finw").style.display="none";
}
function fillNl(){$("nl").innerHTML=Object.keys(nauts).sort().map(function(n){return'<option value="'+esc(n)+'">'}).join("")}
$("naut").addEventListener("input",function(){var n=nauts[this.value];if(n){$("cif").value=n.cif||"";$("tel").value=n.tel||"";$("mail").value=n.mail||""}});

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function finBono(f){var p=f.split("-"),y=+p[0],m=+p[1]-1,d=+p[2],n=m+1,last=new Date(y,n+1,0).getDate();return iso(new Date(y,n,Math.min(d,last)))}
function updFin(){var r=document.querySelector("input[name=sv]:checked"),w=$("finw");if(r&&r.value==="Bono mes rampa"){w.style.display="block";if($("fecha").value)$("fin").value=finBono($("fecha").value)}else{w.style.display="none";$("fin").value=""}}
$("svc").addEventListener("change",updFin);$("fecha").addEventListener("change",updFin);
function pdfBlob(a){
  var J=window.jspdf;if(!J)throw new Error("PDF no disponible (sin conexión al cargar la librería)");
  var d=new J.jsPDF({unit:"mm",format:"a4"}),W=210,m=15;
  d.setFont("helvetica","bold");d.setFontSize(13);d.text(EMP.n,m,20);
  d.setFont("helvetica","normal");d.setFontSize(10);EMP.l.forEach(function(t,i){d.text(t,m,26+i*5)});
  d.setFont("helvetica","bold");d.setFontSize(22);d.text("ALBARÁN",W-m,22,{align:"right"});
  d.setFontSize(11);d.text("Nº "+a.num,W-m,29,{align:"right"});
  d.setFont("helvetica","normal");d.text("Fecha: "+fdate(a.fecha),W-m,35,{align:"right"});
  d.setDrawColor(11,79,138);d.setLineWidth(.6);d.line(m,55,W-m,55);
  function box(y,h,t){d.setLineWidth(.3);d.setDrawColor(150);d.rect(m,y,W-2*m,h);d.setFont("helvetica","bold");d.setFontSize(9);d.setTextColor(90);d.text(t,m+3,y+5);d.setTextColor(0)}
  box(60,30,"NÁUTICA");d.setFont("helvetica","bold");d.setFontSize(12);d.text(a.naut,m+3,70);
  d.setFont("helvetica","normal");d.setFontSize(10);
  d.text("CIF: "+(a.cif||"-")+"     Tel.: "+(a.tel||"-"),m+3,77);d.text("Email: "+(a.mail||"-"),m+3,83);
  box(95,22,"EMBARCACIÓN");d.setFontSize(12);d.text(a.emb,m+3,105);d.setFontSize(10);d.text("Matrícula / folio: "+(a.mat||"-"),m+3,111);
  box(122,40,"SERVICIO");d.setFontSize(11);
  SERV.forEach(function(s,i){var x=m+4+(i%2)*85,y=132+Math.floor(i/2)*11;d.setLineWidth(.4);d.setDrawColor(0);d.rect(x,y-4,5,5);if(a.serv===s){d.setFont("helvetica","bold");d.text("X",x+1.1,y)}d.setFont("helvetica",a.serv===s?"bold":"normal");d.text(s,x+8,y)});
  var y=167;if(a.fin){d.setFont("helvetica","bold");d.setFontSize(11);d.text("Bono válido del "+fdate(a.fecha)+" al "+fdate(a.fin),m,y);y+=9}
  if(a.imp!==""&&a.imp!=null){d.setFont("helvetica","bold");d.setFontSize(12);d.text("Importe: "+Number(a.imp).toFixed(2).replace(".",",")+" €",m,y);y+=9}
  d.setFont("helvetica","normal");d.setFontSize(10);
  if(a.obs){d.setFont("helvetica","bold");d.text("Observaciones:",m,y);d.setFont("helvetica","normal");d.text(d.splitTextToSize(a.obs,W-2*m),m,y+5)}
  d.setLineWidth(.3);d.setDrawColor(150);
  d.rect(m,225,85,35);d.rect(W-m-85,225,85,35);
  d.setFontSize(9);d.setTextColor(90);d.text("Firma y sello del Puerto"+(a.resp?" ("+a.resp+")":""),m+3,230);d.text("Conforme náutica",W-m-82,230);
  d.setFontSize(8);d.text("Documento generado por CN Águilas · "+EMP.l[4],W/2,285,{align:"center"});
  return d.output("blob");
}
function fname(a){return"Albaran-"+a.num+"-"+a.naut.replace(/[^A-Za-z0-9]+/g,"_").slice(0,30)+".pdf"}
function msg(a){return"Albarán nº "+a.num+" · Puerto Deportivo C.N. Águilas\nFecha: "+fdate(a.fecha)+"\nNáutica: "+a.naut+"\nEmbarcación: "+a.emb+(a.mat?" ("+a.mat+")":"")+"\nServicio: "+a.serv+(a.fin?" (válido hasta "+fdate(a.fin)+")":"")+(a.imp!==""&&a.imp!=null?"\nImporte: "+Number(a.imp).toFixed(2).replace(".",",")+" €":"")}
function find(id){return albs.filter(function(a){return a.id===id})[0]}

async function dl(a){
  try{
    var b=pdfBlob(a),c=(window.claude&&claude.use)?await claude.use("downloads"):null;
    if(c){await c.save({filename:fname(a),data:b});toast("PDF descargado")}
    else{var u=URL.createObjectURL(b),l=document.createElement("a");l.href=u;l.download=fname(a);document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}
  }catch(e){if(!e||e.code!=="declined")toast("No se pudo descargar: "+(e&&e.message||e))}
}
function waNum(t){var n=(t||"").replace(/[^\d+]/g,"");if(n.indexOf("+")===0)n=n.slice(1);else if(n.indexOf("00")===0)n=n.slice(2);else if(n.length===9)n="34"+n;return n.replace(/\D/g,"")}
async function send(a,kind){
  var tel=waNum(a.tel);
  if(kind==="wa"&&tel){
    window.open("https://wa.me/"+tel+"?text="+encodeURIComponent(msg(a)),"_blank");
    toast("En WhatsApp pulsa el clip y adjunta el PDF descargado");dl(a);return;
  }
  var b;try{b=pdfBlob(a)}catch(e){return toast(e.message)}
  var f=new File([b],fname(a),{type:"application/pdf"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Albarán "+a.num,text:msg(a)});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  if(kind==="wa"){window.open("https://wa.me/?text="+encodeURIComponent(msg(a)),"_blank")}
  else{window.open("mailto:"+encodeURIComponent(a.mail||"")+"?subject="+encodeURIComponent("Albarán "+a.num+" - Puerto Deportivo C.N. Águilas")+"&body="+encodeURIComponent(msg(a)+"\n\nSe adjunta el albarán en PDF."),"_blank")}
  toast("Descarga el PDF y adjúntalo al mensaje");dl(a);
}
function actsHtml(id,sm){var c=sm?"sm ":"";return'<button class="'+c+'" data-a="pdf" data-id="'+id+'">⬇ PDF</button><button class="'+c+'wa" data-a="wa" data-id="'+id+'">WhatsApp</button><button class="'+c+'sec" data-a="mail" data-id="'+id+'">✉ Email</button>'}
function showRes(a){
  $("res").style.display="block";$("rt").textContent="Albarán "+a.num+" guardado";
  $("rd").textContent=a.naut+" · "+a.emb+" · "+a.serv;$("ra").innerHTML=actsHtml(a.id,false);
  $("res").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function renderHist(){
  var h=$("hist");
  if(!albs.length){h.innerHTML='<span style="color:var(--mut)">Todavía no hay albaranes.</span>';return}
  h.innerHTML=albs.slice().reverse().slice(0,40).map(function(a){
    return'<div class="item"><b>'+esc(a.num)+' · '+esc(a.naut)+'</b><span>'+fdate(a.fecha)+' · '+esc(a.emb)+' · '+esc(a.serv)+'</span><div class="acts">'+actsHtml(a.id,true)+'</div><button class="sec sm" style="margin-top:8px" data-a="del" data-id="'+a.id+'">Eliminar</button></div>'}).join("");
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a]");if(!t)return;
  var a=find(t.dataset.id),k=t.dataset.a;if(!a)return;
  if(k==="pdf")dl(a);else if(k==="wa")send(a,"wa");else if(k==="mail")send(a,"mail");
  else if(k==="del"&&confirm("¿Eliminar el albarán "+a.num+"?")){albs=albs.filter(function(x){return x.id!==a.id});sv("alb",albs);renderHist();$("res").style.display="none"}
});
$("save").addEventListener("click",function(){
  var sel=document.querySelector("input[name=sv]:checked");
  var a={id:"a"+Date.now(),num:$("num").value,fecha:$("fecha").value,naut:$("naut").value.trim(),cif:$("cif").value.trim(),tel:$("tel").value.trim(),mail:$("mail").value.trim(),emb:$("emb").value.trim(),mat:$("mat").value.trim(),serv:sel?sel.value:"",fin:(sel&&sel.value==="Bono mes rampa")?$("fin").value:"",imp:$("imp").value,resp:$("resp").value.trim(),obs:$("obs").value.trim()};
  if(!a.fecha)return toast("Falta la fecha");
  if(!a.naut)return toast("Falta la náutica");
  if(!a.emb)return toast("Falta la embarcación");
  if(!a.serv)return toast("Elige el servicio");
  nauts[a.naut]={cif:a.cif,tel:a.tel,mail:a.mail};sv("nauts",nauts);
  albs.push(a);sv("alb",albs);
  sv("resp",a.resp);
  showRes(a);renderHist();fillNl();resetForm();$("resp").value=a.resp;
});
resetForm();$("resp").value=ld("resp","");fillNl();renderHist();
var dp=null;
function isApp(){return (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true}
if(!isApp())$("inst").hidden=false;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e});
window.addEventListener("appinstalled",function(){$("inst").hidden=true;toast("App instalada. Búscala en tus aplicaciones como Albaranes.")});
$("inst").addEventListener("click",async function(){
  if(dp){dp.prompt();try{await dp.userChoice}catch(e){}dp=null}
  else alert("Si ya la instalaste, ciérrala y búscala en tus aplicaciones (icono del ancla, «Albaranes»); mantén pulsado el icono para llevarlo a la pantalla de inicio.\n\nSi no está instalada: menú ⋮ de Chrome → Instalar aplicación.")
});
if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
